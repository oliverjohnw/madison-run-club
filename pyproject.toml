[project]
name = "run-club"
version = "0.1.0"
description = "Madison Moosehead Run Club - schedule, RSVPs, run log, training plans"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "jinja2>=3.1",
    "bcrypt>=4.2",
    "itsdangerous>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0,<2.1.2",  # 2.1.1 matches the other projects (newer DLLs get blocked by Windows App Control here)
    "psycopg[binary]>=3.2",
    "tzdata>=2025.1",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
